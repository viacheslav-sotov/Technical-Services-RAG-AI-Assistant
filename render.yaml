# Render.com blueprint. Deploys the API and (optionally) the frontend.
# Docs: https://render.com/docs/blueprint-spec
#
# After deploy, set secrets (OPENAI_API_KEY, ADMIN_PASSWORD, etc.) in the Render
# dashboard -> Environment. Never commit real secrets.

services:
  - type: web
    name: tsrag-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: SERVICE
        value: api
      - key: ENVIRONMENT
        value: production
      - key: EMBEDDING_PROVIDER
        value: sentence_transformers
      - key: LLM_PROVIDER
        value: auto
      - key: OPENAI_API_KEY
        sync: false        # set in dashboard
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: "*"
    disk:
      name: tsrag-data
      mountPath: /app/chroma_db
      sizeGB: 1

  - type: web
    name: tsrag-frontend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERVICE
        value: frontend
      - key: BACKEND_URL
        fromService:
          type: web
          name: tsrag-api
          property: hostport
